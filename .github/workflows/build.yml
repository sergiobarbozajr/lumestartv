name: LumeStarTV (compilar, testar e publicar)

# Cada envio para a main: compila, testa no emulador (abertura, menu e fluidez)
# e só publica a versão para a TV se o teste passar.
on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumestartv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.name }}
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Baixar o FFmpeg do conversor (compilado por nós, 32 e 64 bits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p app/libs && gh release download ffmpeg-kit-lume-6.0-2 -p ffmpeg-kit-lume.aar -D app/libs --clobber --repo ${{ github.repository }}

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumestar.keystore"

      - name: Compilar o APK
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          TMDB_KEY_2: ${{ secrets.TMDB_KEY_2 }}
          STORE_FILE: ${{ runner.temp }}/lumestar.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Mostrar erros de compilacao
        if: failure()
        run: |
          E=$(grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -40 | cut -c1-300 | tr '\n' '|' | cut -c1-3800)
          echo "::error title=Erro de compilacao::$E"

      - name: Ler a versao do app
        id: ver
        run: |
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk LumeStarTV.apk

      - name: APK de teste (com x86_64 para o emulador; não é publicado)
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          TMDB_KEY_2: ${{ secrets.TMDB_KEY_2 }}
          STORE_FILE: ${{ runner.temp }}/lumestar.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease -Pteste --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk LumeStarTV-teste.apk

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: LumeStarTV-apk
          path: |
            LumeStarTV.apk
            LumeStarTV-teste.apk
          if-no-files-found: error

  # Lista as chamadas a recursos que não existem no Android 5.1 (minSdk 21).
  # Não trava a publicação: o relatório vai para o ramo "lint".
  compatibilidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Baixar o FFmpeg do conversor
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p app/libs && gh release download ffmpeg-kit-lume-6.0-2 -p ffmpeg-kit-lume.aar -D app/libs --clobber --repo ${{ github.repository }} || true
      - name: Verificar compatibilidade com Android 5 (lint NewApi)
        run: gradle :app:lintDebug --no-daemon || true
      - name: Enviar relatorio para o ramo "lint"
        if: always()
        run: |
          mkdir -p rel
          cp app/build/lint-newapi.txt rel/ 2>/dev/null || echo "relatorio nao gerado" > rel/lint-newapi.txt
          cd rel && git init -q -b lint && git add -A
          git -c user.name=ci -c user.email=ci@lumestar commit -q -m "lint ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" lint || true

  teste:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30 # o emulador às vezes trava; sem limite seguraria a publicação por até 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LumeStarTV-apk
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir no emulador (abertura, menu e fluidez)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: false
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -no-snapshot -camera-back none -memory 3072
          script: bash tools/teste.sh
      - name: Guardar capturas e registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-capturas
          path: teste/
      - name: Enviar capturas para o ramo "capturas" (para conferir as telas)
        if: always()
        run: |
          cd teste || exit 0
          git init -q -b capturas && git add -A
          git -c user.name=ci -c user.email=ci@lumestar commit -q -m "capturas ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" capturas || true
      - name: Resultado
        if: always()
        run: |
          cat teste/resumo.txt || true
          if [ -f teste/falhou.txt ]; then echo "::error title=Teste falhou::$(cat teste/falhou.txt)"; exit 1; fi

  publicar:
    needs: [ build, teste ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LumeStarTV-apk
      - name: Publicar a versao para a atualizacao dentro do app
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: LumeStarTV ${{ needs.build.outputs.version }}
          files: LumeStarTV.apk
